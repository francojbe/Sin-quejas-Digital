<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin Quejas — Sin Conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050505;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(208,255,0,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      padding: 48px 32px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(208,255,0,0.08);
      border: 1px solid rgba(208,255,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(208,255,0,0.15); }
      50% { box-shadow: 0 0 0 16px rgba(208,255,0,0); }
    }

    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      stroke: #d0ff00;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(208,255,0,0.6);
      background: rgba(208,255,0,0.08);
      border: 1px solid rgba(208,255,0,0.15);
      padding: 4px 12px;
      border-radius: 999px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #ffffff;
    }

    p {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
      max-width: 260px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    button {
      width: 100%;
      background: #d0ff00;
      color: #000000;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 30px rgba(208,255,0,0.2);
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 40px rgba(208,255,0,0.35);
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="card">
    <div class="icon-wrapper">
      <!-- Wifi Off Icon -->
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <span class="badge">Modo Offline</span>

    <h1>Sin Conexión</h1>

    <p>
      No pudimos conectar con el servidor. Verifica tu señal y vuelve a intentarlo.
    </p>

    <div class="divider"></div>

    <button onclick="window.location.reload()">
      Reintentar conexión
    </button>

    <span class="hint">Sin Quejas Digital • v1.1</span>
  </div>
</body>
</html>
